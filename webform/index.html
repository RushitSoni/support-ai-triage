<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Support Request</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #1a1a1a; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 16px; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
  textarea { min-height: 120px; resize: vertical; }
  button { margin-top: 20px; padding: 10px 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 0.9rem; }
  #status.ok { color: #157347; }
  #status.err { color: #b02a37; }
</style>
</head>
<body>
  <h1>Contact Support</h1>
  <p class="sub">Submit a ticket — it will be routed automatically.</p>

  <form id="ticketForm">
    <label for="name">Your name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="subject">Subject</label>
    <input type="text" id="subject" required>

    <label for="message">Message</label>
    <textarea id="message" required></textarea>

    <button type="submit" id="submitBtn">Submit ticket</button>
    <div id="status"></div>
  </form>

  <script>
    // Replace this with your actual n8n webhook URL, e.g.
    // http://localhost:5678/webhook/support-intake
    const WEBHOOK_URL = "http://localhost:5678/webhook/support-intake";

    const form = document.getElementById("ticketForm");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      statusEl.textContent = "Sending...";
      statusEl.className = "";

      const payload = {
        source: "webform",
        requester_name: document.getElementById("name").value,
        requester_email: document.getElementById("email").value,
        subject: document.getElementById("subject").value,
        body_raw: document.getElementById("message").value
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Request failed: " + res.status);

        statusEl.textContent = "Ticket submitted. We'll be in touch shortly.";
        statusEl.className = "ok";
        form.reset();
      } catch (err) {
        statusEl.textContent = "Something went wrong: " + err.message;
        statusEl.className = "err";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
