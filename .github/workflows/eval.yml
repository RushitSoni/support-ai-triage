name: Classification Eval

on:
  push:
    paths:
      - 'eval/**'
      - 'kb_pipeline/**'
  pull_request:
    paths:
      - 'eval/**'
      - 'kb_pipeline/**'
  workflow_dispatch: {}

jobs:
  run-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ADD THIS STEP HERE
      - name: Test Groq API from GitHub Actions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          url = "https://api.groq.com/openai/v1/models"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "User-Agent": "github-actions-groq-test"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("STATUS:", r.status)
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              print("STATUS:", e.code)
              print("HEADERS:")
              print(e.headers)
              print("BODY:")
              print(e.read().decode())
              raise
          PY

      # YOUR EXISTING EVAL STEP
      - name: Run classification eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd eval
          python3 eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/eval_results.json